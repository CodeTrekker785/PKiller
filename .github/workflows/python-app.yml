name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython==0.29.37"

      - name: Install project dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Configure Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=35" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=27c" >> "$GITHUB_ENV"

      - name: Show configuration
        run: |
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Python: $(python --version)"
          echo "Java:"
          java -version
          echo "Buildozer:"
          buildozer --version
          echo "Installed Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools"

      - name: Build APK
        env:
          P4A_RELEASE = "1"
        run: |
          buildozer android debug

      - name: Check APK
        run: |
          echo "Generated APK files:"
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PKiller-debug-apk
          path: bin/*.apk
          if-no-files-found: error